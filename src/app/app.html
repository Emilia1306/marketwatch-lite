<div class="container py-4">

  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
  >

    <h1 class="mb-0">
      MarketWatch Lite
    </h1>

    <button
      type="button"
      class="btn"
      [class.btn-warning]="showOnlyFavorites"
      [class.btn-outline-secondary]="!showOnlyFavorites"
      (click)="toggleFavoritesFilter()"
    >

      @if (showOnlyFavorites) {
        Mostrar todos
      } @else {
        Solo favoritos
      }

    </button>

  </div>

  <input
    type="text"
    class="form-control mb-4"
    placeholder="Buscar por nombre o símbolo"
    [value]="searchTerm"
    (input)="searchTerm = $any($event.target).value; filterCryptos()"
  >

  @if (loading) {

    <div class="text-center py-5">

      <div
        class="spinner-border"
        role="status"
      ></div>

      <p class="mt-3">
        Cargando criptomonedas...
      </p>

    </div>

  }

  @if (errorMessage) {

    <div class="alert alert-danger">

      <p class="mb-3">
        {{ errorMessage }}
      </p>

      <button
        type="button"
        class="btn btn-danger"
        (click)="loadCryptos()"
      >
        Reintentar
      </button>

    </div>

  }

  @if (!loading && !errorMessage) {

    <div class="row g-3">

      @for (crypto of filteredCryptos; track crypto.id) {

        <div class="col-12 col-md-6 col-lg-4">

          <app-crypto-card
            [crypto]="crypto"
            [isFavorite]="isFavorite(crypto.id)"
            (cryptoSelected)="selectCrypto($event)"
            (favoriteToggled)="toggleFavorite($event)"
          />

        </div>

      } @empty {

        <div class="col-12">

          <div class="alert alert-secondary">
            No se encontraron criptomonedas
          </div>

        </div>

      }

    </div>

  }

</div>

@if (selectedCrypto) {

  <app-crypto-detail
    [crypto]="selectedCrypto"
    (close)="closeDetail()"
  />

}
